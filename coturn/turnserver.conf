# Coturn — configuración LOCAL (desarrollo).
# Producción: usa turnserver.prod.conf (credenciales efímeras, TLS, IP externa).

listening-port=3478
# Rango pequeño para poder publicarlo fácilmente con Docker (-p 49160-49200:49160-49200/udp)
min-port=49160
max-port=49200

realm=friendegle.local
fingerprint

# Usuario estático SOLO para desarrollo. El backend lo reparte en TURN_USER / TURN_PASS.
lt-cred-mech
user=friendegle:friendegle123

# En local los dos navegadores reciben direcciones relay de la red interna de Docker
# (172.17.x.x), así que aquí NO se bloquean rangos privados. En producción sí.

no-tls
no-dtls
no-cli
no-multicast-peers
no-software-attribute

# Límites básicos contra abuso
user-quota=12
total-quota=200

log-file=stdout
simple-log
