# Coturn — configuración de PRODUCCIÓN (DigitalOcean, vía deploy/docker-compose.yml).
#
# Este archivo NO contiene secretos ni valores propios del servidor: IP pública, dominio y
# TURN_SECRET se pasan por línea de comandos desde deploy/.env.production (ver docker-compose.yml).

listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=65535
fingerprint

# Credenciales efímeras (TURN REST API): el backend firma "caducidad:User_XXXX" con
# static-auth-secret (= TURN_SECRET, se pasa con --static-auth-secret). Sin usuarios estáticos.
use-auth-secret

# TLS (turns: por el 5349). deploy/sync-turn-certs.sh copia aquí el certificado que obtiene Caddy.
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
no-tlsv1
no-tlsv1_1
cipher-list="ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256"

# --- Anti-abuso -------------------------------------------------------------
# El relay no puede usarse para alcanzar redes internas ni la propia máquina (evita SSRF)
no-multicast-peers
no-loopback-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Los navegadores solo usan relay UDP; el relay TCP (RFC 6062) solo serviría para abusar
no-tcp-relay
# Cuotas: asignaciones simultáneas por usuario y totales, y ancho de banda por sesión (~3 Mbps)
user-quota=12
total-quota=1200
max-bps=3000000
stale-nonce=600

no-cli
no-software-attribute
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780

# Logs a stdout (Docker los rota, ver docker-compose.yml). simple-log: sin fecha en el nombre
log-file=stdout
simple-log
